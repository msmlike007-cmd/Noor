workflows:
  nurnama-play-store:
    name: Noornama - Google Play AAB
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - nurnama_keystore
    scripts:
      - name: Create Android platform project
        script: |
          flutter create --platforms=android --org com.masum --project-name nurnama /tmp/nurnama_android
          cp -R /tmp/nurnama_android/android ./android
      - name: Generate assets and configure Android
        script: |
          python3 -m pip install --upgrade pillow
          python3 setup.py
          python3 scripts/set_android_sdk.py
      - name: Resolve Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Build signed Play Store App Bundle
        script: |
          AZAN=false
          if [ -f azan.mp3 ] || [ -f audio/azan.mp3 ]; then AZAN=true; fi
          flutter build appbundle --release --dart-define=AZAN=$AZAN
    artifacts:
      - build/app/outputs/bundle/release/*.aab
